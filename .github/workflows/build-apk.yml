name: Build Farun Messenger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Recreate project files
        shell: bash
        run: |
          mkdir -p "$(dirname 'README_RU.md')"
          echo '' | base64 -d > 'README_RU.md'
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'build.gradle')"
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzIuMC4yMScgYXBwbHkgZmFsc2UKfQo=' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle')"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/farun/messenger/MainActivity.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/farun/messenger/MainActivity.kt'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        shell: bash
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Farun-Messenger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
