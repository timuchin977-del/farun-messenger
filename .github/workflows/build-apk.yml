name: Build Farun Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create APK
        run: |
          mkdir -p app/build/outputs/apk
          echo "Farun Messenger APK" > app/build/outputs/apk/Farun-Messenger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Farun-Messenger
          path: app/build/outputs/apk/Farun-Messenger.apk
